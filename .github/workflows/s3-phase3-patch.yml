name: S3 Phase 3 Patch Applicator
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - phase/s3-b3-b4-b8-security-cleanup
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase/s3-b3-b4-b8-security-cleanup
          fetch-depth: 0
      - name: Harden and make applicator idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/s3_cpu_gate/build/s3_phase3_apply.py')
          text=path.read_text(encoding='utf-8')
          replacements={
            "r'function Remove-S3CloudflareResource \\{.*?Export-ModuleMember -Function \\*-S3\\*\\s*$'":
              "r'function (?:Test-S3CloudflareCleanupOwnership|Remove-S3CloudflareResource) \\{.*?Export-ModuleMember -Function \\*-S3\\*\\s*$'",
            "$workerDelete = [ordered]@{status='NOT_ATTEMPTED'}":
              "$workerDelete = [ordered]@{status='NOT_ATTEMPTED';exitCode=$null}",
            "$d1Delete = [ordered]@{status='NOT_ATTEMPTED'}":
              "$d1Delete = [ordered]@{status='NOT_ATTEMPTED';exitCode=$null}",
            "$workerDelete = [ordered]@{status='FAILED';reason=Protect-S3Text $_.Exception.Message}":
              "$workerDelete = [ordered]@{status='FAILED';exitCode=$null;reason=Protect-S3Text $_.Exception.Message}",
            "$d1Delete = [ordered]@{status='FAILED';reason=Protect-S3Text $_.Exception.Message}":
              "$d1Delete = [ordered]@{status='FAILED';exitCode=$null;reason=Protect-S3Text $_.Exception.Message}",
            "$status = if ($workerOk -and $d1Ok -and $proof.status -eq 'PASS') {'DELETED'} elseif ($workerOk -xor $d1Ok) {'PARTIAL'} elseif ($proof.status -eq 'UNKNOWN') {'UNKNOWN'} else {'FAILED'}":
              "$status = if ($workerDelete.status -ne 'REQUESTED' -or $d1Delete.status -ne 'REQUESTED') {'FAILED'} elseif ($workerOk -and $d1Ok -and $proof.status -eq 'PASS') {'DELETED'} elseif ($proof.status -eq 'UNKNOWN') {'UNKNOWN'} elseif ($proof.workerAbsent -xor $proof.d1Absent) {'PARTIAL'} else {'FAILED'}",
            "if ($marker -ne [string]$Context.RunId -or $worker -notmatch '^s3cpu-' -or $d1Name -notmatch '^s3cpu-' -or [string]::IsNullOrWhiteSpace($d1Id) -or [string]::IsNullOrWhiteSpace($accountId)) {":
              "if (-not (Test-S3OwnedResource -Context $Context -Name $worker -Marker $marker) -or -not (Test-S3OwnedResource -Context $Context -Name $d1Name -Marker $marker) -or $worker -notmatch '^s3cpu-' -or $d1Name -notmatch '^s3cpu-' -or [string]::IsNullOrWhiteSpace($d1Id) -or [string]::IsNullOrWhiteSpace($accountId)) {",
            "$context.State.resources.cloudflare = [ordered]@{accountId=$accountId;worker='s3cpu-owned-worker';d1Name='s3cpu-owned-d1';d1Id='11111111-2222-3333-4444-555555555555';marker=$context.RunId}":
              "$context.State.resources.cloudflare = [ordered]@{accountId=$accountId;worker=\"$($context.RunId)-worker\";d1Name=\"$($context.RunId)-d1\";d1Id='11111111-2222-3333-4444-555555555555';marker=$context.RunId}",
            "$response = Invoke-S3GoogleRest -Method GET -Uri \"$base/$collection\" -Token $Token\n        $items = @(Get-S3RequiredArrayProperty -InputObject $response -Name $collection)":
              "$response = Invoke-S3GoogleRest -Method GET -Uri \"$base/$collection?pageSize=100\" -Token $Token\n        $items = @(Get-S3RequiredArrayProperty -InputObject $response -Name $collection)\n        $nextPageToken = [string](Get-S3MapValue -Map $response -Name 'nextPageToken')\n        if (-not [string]::IsNullOrWhiteSpace($nextPageToken)) { throw \"FIREBASE_PROVIDER_PAGINATION_INCOMPLETE:$collection\" }",
            "$collection=($Uri -split '/')[-1]":
              "$collection=((($Uri -split '/')[-1]) -split '\\?')[0]"
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected applicator fragment not found: {old[:100]}')
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Apply scoped patch
        run: python tools/s3_cpu_gate/build/s3_phase3_apply.py
      - name: Commit scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          git add PROJECT_STATE.md docs/evidence/S3-PHASE-3-B3-B4-B8-IMPLEMENTATION-REPORT.md tools/s3_cpu_gate/src/modules/Firebase.psm1 tools/s3_cpu_gate/src/modules/Cloudflare.psm1 tools/s3_cpu_gate/src/modules/Cleanup.psm1 tools/s3_cpu_gate/src/S3-CpuGate-Orchestrator.ps1 tools/s3_cpu_gate/tests/pester/SecurityCleanup.Tests.ps1 tools/s3_cpu_gate/docs/USER-GUIDE-AR.md tools/s3_cpu_gate/docs/SECURITY-REVIEW.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S3: implement B3/B4/B8 fail-closed security and cleanup'
          git push origin HEAD:phase/s3-b3-b4-b8-security-cleanup
