name: S2 architecture validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Compile Python validators
        run: python -m py_compile scripts/reconstruct_requirements.py scripts/validate_foundation.py scripts/validate_s2.py prototype/s2_local_architecture/core.py

      - name: Reconstruct authoritative DOCX
        run: python scripts/reconstruct_requirements.py

      - name: Validate S1 foundation regression
        run: python scripts/validate_foundation.py

      - name: Validate S2 local architecture prototype
        run: python scripts/validate_s2.py

      - name: Verify approved architecture decision and safeguards
        run: |
          grep -Fq -- '- الحالة: **Accepted**' docs/architecture/ADR-001-FREE-ARCHITECTURE.md
          grep -Fq -- '| D-006 | 2026-08-03 |' docs/DECISION_LOG.md
          grep -Fq -- 'Fail closed' docs/architecture/ADR-001-FREE-ARCHITECTURE.md
          grep -Fq -- 'عدد صحيح من **الهللات**' docs/architecture/FINANCIAL_INTEGER_RULE.md
          grep -Fq -- 'Cloudflare Zero Trust' docs/architecture/ADR-001-FREE-ARCHITECTURE.md
          grep -Fq -- 'Firebase Blaze' docs/architecture/ADR-001-FREE-ARCHITECTURE.md
          if git diff --quiet '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' -- docs/DECISION_LOG.md; then
            echo 'DECISION_LOG.md was not updated after explicit architecture approval'
            exit 1
          fi
