name: S3 Administrative Materializer

on:
  push:
    branches:
      - phase/s3-b2-b5-administrative-record-20260806
    paths:
      - ".tmp/s3-admin-xz.part*"
      - ".github/workflows/s3-admin-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Materialize verified administrative payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import lzma
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          parts = sorted((root / ".tmp").glob("s3-admin-xz.part*"))
          if not parts:
              raise SystemExit("No materialization chunks were found")

          encoded = "".join(p.read_text(encoding="ascii") for p in parts)
          archive = base64.b64decode(encoded, validate=True)
          expected_archive_sha256 = "2e86cc2aa46a9e0b313b92b1daf5f3441ffc23d177ea42bf37cfb9aeb17a6507"
          actual_archive_sha256 = hashlib.sha256(archive).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  f"Archive SHA-256 mismatch: {actual_archive_sha256} != {expected_archive_sha256}"
              )

          raw_tar = lzma.decompress(archive, format=lzma.FORMAT_XZ)
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode="r:") as tf:
              seen: set[str] = set()
              for member in tf.getmembers():
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"Unsupported archive member: {member.name}")
                  normalized = pure.as_posix().lstrip("./")
                  if not normalized or normalized in seen:
                      raise SystemExit(f"Duplicate or empty archive path: {member.name}")
                  seen.add(normalized)
              tf.extractall(path=root, filter="data")

          manifest_path = root / "S3_ADMIN_FILE_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if len(manifest) != 64:
              raise SystemExit(f"Unexpected final file count in manifest: {len(manifest)}")

          for relative, expected_sha256 in manifest.items():
              target = (root / relative).resolve()
              if target != root and root not in target.parents:
                  raise SystemExit(f"Manifest path escapes repository: {relative}")
              if not target.is_file():
                  raise SystemExit(f"Manifest file missing: {relative}")
              actual_sha256 = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(
                      f"File SHA-256 mismatch for {relative}: {actual_sha256} != {expected_sha256}"
                  )

          manifest_path.unlink()
          shutil.rmtree(root / ".tmp", ignore_errors=True)
          (root / ".github/workflows/s3-admin-materialize.yml").unlink(missing_ok=True)
          (root / "__temp_should_not_exist__").unlink(missing_ok=True)

          if (root / ".tmp").exists():
              raise SystemExit("Temporary staging directory remains")
          if (root / ".github/workflows/s3-admin-materialize.yml").exists():
              raise SystemExit("Temporary materializer workflow remains")
          if (root / "__temp_should_not_exist__").exists():
              raise SystemExit("Temporary probe file remains")

          for path in root.rglob("*"):
              if path.name == "__pycache__" or path.suffix == ".pyc":
                  raise SystemExit(f"Compiled Python artifact is prohibited: {path}")

          print("S3 ADMIN MATERIALIZATION: PASS")
          print(f"ARCHIVE SHA-256: {actual_archive_sha256}")
          print(f"FINAL MANIFEST FILES: {len(manifest)}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "S3: record approved B2/B5 tooling and verification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
